<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0F6CBD" />

  <!-- Waterfall bars (payment tiers) — left column -->
  <rect x="18" y="28" width="22" height="12" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <rect x="18" y="46" width="22" height="12" rx="3" fill="#FFFFFF" opacity="0.80"/>
  <rect x="18" y="64" width="22" height="12" rx="3" fill="#FFFFFF" opacity="0.65"/>
  <rect x="18" y="82" width="22" height="12" rx="3" fill="#FFFFFF" opacity="0.50"/>

  <!-- Downward flow arrow between columns -->
  <line x1="48" y1="34" x2="56" y2="34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="52" x2="56" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="70" x2="56" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="88" x2="56" y2="88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right column (output values) — wider -->
  <rect x="60" y="24" width="50" height="14" rx="3" fill="#4FC3F7" opacity="0.95"/>
  <rect x="60" y="44" width="40" height="14" rx="3" fill="#4FC3F7" opacity="0.80"/>
  <rect x="60" y="64" width="32" height="14" rx="3" fill="#4FC3F7" opacity="0.65"/>
  <rect x="60" y="84" width="24" height="14" rx="3" fill="#4FC3F7" opacity="0.50"/>

  <!-- Dollar sign overlay in center-right -->
  <text x="95" y="107" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" opacity="0.92">$</text>
</svg>
